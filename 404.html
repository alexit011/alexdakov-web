<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página no encontrada — Alex Dakov</title>
  <meta name="description" content="Esta página ya no existe. Vuelve al inicio de alexdakov.com.">
  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy-base: #090C17;
      --navy-card: #14213D;
      --text: #F0EBE0;
      --text-secondary: #A09B92;
      --gold: #C9A961;
      --border: rgba(240,235,224,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--navy-base);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      text-align: center;
    }
    .wrap { max-width: 640px; }
    .code {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(64px, 14vw, 120px);
      line-height: 1;
      color: var(--gold);
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(24px, 5vw, 34px);
      font-weight: 500;
      margin-bottom: 14px;
    }
    p { color: var(--text-secondary); font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .links a {
      display: inline-block;
      padding: 13px 22px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--navy-card);
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      transition: border-color .2s ease, color .2s ease;
    }
    .links a:hover { border-color: var(--gold); color: var(--gold); }
    .links a.primary { background: var(--gold); color: #090C17; border-color: var(--gold); font-weight: 600; }
    .links a.primary:hover { color: #090C17; opacity: .9; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="code">404</div>
    <h1>Esta página ya no existe</h1>
    <p>Puede que el enlace sea antiguo o esté mal escrito. Te dejo por dónde seguir:</p>
    <nav class="links">
      <a class="primary" href="/">Inicio</a>
      <a href="/newsletter/">Newsletter</a>
      <a href="/conferencias/">Conferencias</a>
      <a href="/descubre-tu-nivel-liderazgo/">Test de liderazgo</a>
      <a href="/contacto/">Contacto</a>
    </nav>
  </main>
</body>
</html>
